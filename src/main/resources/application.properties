# Дatasource с встроенным пулом Agroal
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:./quarkus-swing-db;DB_CLOSE_DELAY=-1
quarkus.datasource.jdbc.initial-size=2
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# Hibernate ORM (авто-создание таблиц для демо)
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.sql.format=true